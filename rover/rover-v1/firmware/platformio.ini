; Rover C3 firmware (spec/core/build.md). Open rover-c3.code-workspace in VS Code so PlatformIO
; finds this project.

[platformio]
default_envs = xiao   ; the owner's board; the SuperMini env stays supported

; Shared by both boards. Versions pinned to what was built and checked (spec/core/build.md#versions):
; espressif32 7.1.3 ships Arduino core 2.0.17.
[esp32c3]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra
; the unit tests run on the PC only: pio test -e native
test_ignore = *

; ESP32-C3 SuperMini (generic C3 board + native USB serial)
[env:supermini]
extends = esp32c3
board = esp32-c3-devkitm-1

; Seeed XIAO ESP32C3
[env:xiao]
extends = esp32c3
board = seeed_xiao_esp32c3

; PC-side unit tests for the pure C++ logic in lib/RoverCore (needs gcc on PATH). gnu++11 is what
; the ESP32 build uses, so code that passes here also builds there.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra
